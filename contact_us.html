    <h1>Contact Us</h1>
    <p>If you have any questions, feedback or want to feature your restaurant on our platform, please feel free to reach out to us using the form below:</p>
    <form action="confirmation.html" method="get">
        <label for="fullname">Name: *</label>
        <input required type="text" id="fullname" name="fullname"><br><br>
        <label for="email">Email: *</label>
        <input required type="email" id="email" name="email"><br><br>
        <label for="message">Message:</label><br>
        <textarea id="message" name="message"></textarea><br><br>
        <label for="restaurant">Restaurant Name (if applicable):</label>
        <input type="text" id="restaurant" name="restaurant"><br><br>
        <label for="location">Location (if applicable):</label>
        <input type="text" id="location" name="location"><br><br>
        <input type="submit" value="Submit">
    </form>
